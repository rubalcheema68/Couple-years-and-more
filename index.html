<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 2nd Anniversary ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

font-family:Poppins,sans-serif;

background:linear-gradient(135deg,#fff0f5,#ffe4ec);

overflow:hidden;

text-align:center;

}

h1{

font-family:'Great Vibes',cursive;

font-size:80px;

color:#e91e63;

margin-bottom:20px;

animation:fadeIn 2s;

}

h2{

font-size:28px;

color:#555;

font-weight:400;

margin-bottom:15px;

animation:fadeIn 2.5s;

}

p{

font-size:20px;

color:#666;

max-width:700px;

line-height:1.8;

margin-bottom:40px;

animation:fadeIn 3s;

}

button{

padding:18px 45px;

font-size:22px;

border:none;

border-radius:50px;

background:#e91e63;

color:white;

cursor:pointer;

transition:.3s;

animation:fadeIn 3.5s;

}

button:hover{

transform:scale(1.05);

}

.heart{

position:fixed;

font-size:25px;

animation:float linear infinite;

pointer-events:none;

opacity:.8;

}

@keyframes float{

0%{

transform:translateY(100vh);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<h1>Happy 2nd Anniversary ❤️</h1>

<h2>For Gursimran</h2>

<p>

Two years of love, laughter, unforgettable memories, and countless reasons to smile.

Thank you for being my best friend, my biggest supporter, and my favorite person.

This little website is just a reminder of how much you mean to me.

</p>

<button onclick="window.location.href='story.html'">

Start Our Journey ❤️

</button>

<script>

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*20)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},10000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
